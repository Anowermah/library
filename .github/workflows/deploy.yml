name: Deploy to cPanel via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Configure PostgreSQL Schema & Generate Prisma Client
        run: |
          if [ -f prisma/schema.postgresql.prisma ]; then
            echo "Using PostgreSQL schema for production build..."
            cp prisma/schema.postgresql.prisma prisma/schema.prisma
          fi
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: 🏗️ Build Next.js Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://library.atrbd.com
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: ⚡ Prepare Production Package for cPanel
        run: |
          # 1. Copy .next/static to public/_next/static for direct Apache/LiteSpeed serving
          mkdir -p public/_next
          cp -r .next/static public/_next/
          
          # 2. Ensure tmp directory exists for Passenger instant reload
          mkdir -p tmp
          touch tmp/restart.txt
          
          # 3. Write production .env file
          cat << 'EOF' > .env
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}"
          NEXTAUTH_URL="https://library.atrbd.com"
          NODE_ENV="production"
          PORT=3000
          EOF

      - name: 🚀 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DEPLOY_PATH || 'library.atrbd.com/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .next/cache/**
            *.db*
            scripts/**
            tests/**
            backups/**
